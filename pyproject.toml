[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdisc-library-mcp"
dynamic = ["version"]
description = "MCP Server for CDISC Library API - Clinical Data Standards Access"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CDISC MCP Contributors" }
]
keywords = ["cdisc", "mcp", "clinical-data", "sdtm", "adam", "terminology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # Lower bound: Tool/ToolAnnotations fields used by the tool definitions
    # (annotations arrived with the 2025-03-26 spec, SDK 1.6).
    # Upper bound required: the server registers components with the
    # ``@server.list_resources()`` / ``@server.list_tools()`` decorator API, which
    # mcp 2.0.0 removed (``'Server' object has no attribute 'list_resources'``).
    # Migrating to the 2.x API is tracked separately; until then 2.x must not resolve.
    "mcp>=1.6.0,<2.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cdisc-library-mcp = "cdisc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/whereayan/cdisc-library-mcp"
Documentation = "https://github.com/whereayan/cdisc-library-mcp#readme"
Repository = "https://github.com/whereayan/cdisc-library-mcp"

[tool.hatch.version]
path = "src/cdisc_mcp/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cdisc_mcp"]

# Whitelist, not blacklist: the default sdist recipe sweeps in repository files,
# which once carried a local client config (with an API key) onto PyPI.
# Only these paths may ever reach PyPI; add a path here deliberately, never by
# accident. Run scripts/check_secrets.py before uploading as a second gate.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/cdisc_mcp",
    "tests",
    "docs",
    "scripts",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".env.example",
]

[tool.hatch.build]
# Ignore VCS-only paths (client configs live in dot-directories) when building.
exclude-vcs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/cdisc_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]