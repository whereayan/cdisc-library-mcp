[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdisc-library-mcp"
version = "0.1.4"
description = "MCP Server for CDISC Library API - Clinical Data Standards Access"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "CDISC MCP Contributors" }
]
keywords = ["cdisc", "mcp", "clinical-data", "sdtm", "adam", "terminology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cdisc-library-mcp = "cdisc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/whereayan/cdisc-library-mcp"
Documentation = "https://github.com/whereayan/cdisc-library-mcp#readme"
Repository = "https://github.com/whereayan/cdisc-library-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/cdisc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/cdisc_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]